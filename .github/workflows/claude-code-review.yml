---
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]'
    uses: KumaaGroup/github-workflows/.github/workflows/claude-code-review.yml@main
    secrets: inherit

  # Stable status check name for the branch ruleset; the reusable workflow
  # surfaces as a nested context, so this job exposes one predictable check.
  claude-pr-review:
    name: claude-pr-review
    needs: [claude-review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify Claude review completed
        run: |
          result="${{ needs.claude-review.result }}"
          echo "claude-review result: ${result}"
          if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
            echo "::error::Claude Code Review did not complete successfully"
            exit 1
          fi
